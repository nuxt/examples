packages:
  - shared
  - examples/**
  - .e2e
  - '!**/.vercel/**'
patchedDependencies:
  '@nuxtjs/tailwindcss': patches/@nuxtjs__tailwindcss.patch

overrides:
  "@nuxt/examples-ui": "workspace:*"
  "@nuxt/kit": "4.6.0"
  "@vue/shared": "3.5.43"
  # just-bash's optional zstd and xz codecs: native builds the eve dev sandbox doesn't need
  "just-bash>@mongodb-js/zstd": "-"
  "just-bash>node-liblzma": "-"
  nuxt: "4.6.0"
  vue: "3.5.43"

shellEmulator: true

allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  unrs-resolver: false
  vue-demi: false

minimumReleaseAgeExclude:
  - nuxt
  - nuxt-nightly
  - '@nuxt/*'
  - vue
  - '@vue/*'
  - eve@0.84.1
